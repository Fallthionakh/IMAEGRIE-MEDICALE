<style>

:root[data-theme="dark"]{--bg:#0f151b;--surface:#18212a;--sunk:#121a21;--ink:#e6edf3;--muted:#9aa8b5;--line:#2c3945;--accent:#5fa8dc;--accent-ink:#06121c;--ok:#4cc28a;--warn:#e3a849;--warn-soft:#3b2b10;--err:#f08077;

*{box-sizing:border-box}

.muted{color:var(--muted)}.small{font-size:.85rem}.warnTxt{color:var(--warn)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}

.addRow{display:flex;gap:8px}.addRow.wrap{flex-wrap:wrap}.addRow.wrap input{flex:1 1 180px;width:auto}
.btn.onfam{background:var(--surface);color:var(--ink);border-color:rgba(0,0,0,.25)}

td.c-echo.on{background:var(--t-echo)}td.c-rx.on{background:var(--t-rx)}td.c-dop.on{background:var(--t-dop)}td.c-spe.on{background:var(--t-spe)}td.c-mam.on{background:var(--t-mam)}td.c-scan.on{background:var(--t-scan)}

<script>
const Y=365;
const norm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
/* ===== Imagerie : catalogue et registre (modèle du classeur FEV_MARS) ===== */
const IMG_FAM_DEF=[['rx','Radiographie standard','radio'],['spe','Examens spéciaux (avec préparation)','radio'],['mam','Mammographie','radio'],['echo','Échographie','echo'],['dop','Doppler','echo']];
const IMG_SYS_DEF=['Osseux','Respiratoire','Digestif'];
const TARIF_DEF={rx:10000,spe:25000,mam:20000,echo:15000,dop:25000};
/* Types d'examen et systèmes : référentiels configurables (Paramètres ou saisie), reconstruits depuis l'état */
const IMG_FAM={},IMG_SYS=[];
function imgSyncRef(noState){const st=noState?null:S;Object.keys(IMG_FAM).forEach(k=>delete IMG_FAM[k]);
  (st&&st.imgTypes||IMG_FAM_DEF.map(([id,l,svc])=>({id,l,svc}))).forEach(t=>IMG_FAM[t.id]={l:t.l,svc:t.svc});
  IMG_SYS.length=0;IMG_SYS.push(...(st&&st.imgSys||IMG_SYS_DEF))}
imgSyncRef(true);

/* [id, libellé, famille, système (radiographie), abréviations et variantes du registre, poids fictif mensuel] */
const IMG_DEF=[
 ['r_avbras','Avant-bras','rx','Osseux','avant bras',84],['r_bassin','Bassin','rx','Osseux','',138],['r_blondeau','Blondeau','rx','Osseux','',3],['r_bras','Bras','rx','Osseux','',31],
 ['r_cheville','Cheville','rx','Osseux','',114],['r_coude','Coude','rx','Osseux','',84],['r_crane','Crâne','rx','Osseux','crane',2],['r_dfp','Défilé fémoro-patellaire','rx','Osseux','defile femoro patellaire, DFP',2],
 ['r_epaule','Épaule','rx','Osseux','epaule',84],['r_facebasse','Face basse','rx','Osseux','',4],['r_femur','Fémur','rx','Osseux','femur',76],['r_genou','Genou','rx','Osseux','',170],
 ['r_hanche','Hanche','rx','Osseux','',60],['r_jambe','Jambe','rx','Osseux','',158],['r_main','Main','rx','Osseux','',94],['r_maxdef','Maxillaire défilé','rx','Osseux','maxillaire defile',34],
 ['r_opn','Os propres du nez (OPN)','rx','Osseux','os propre du nez, OPN',2],['r_pied','Pied','rx','Osseux','',112],['r_poignet','Poignet','rx','Osseux','',106],['r_rcerv','Rachis cervical','rx','Osseux','',22],
 ['r_rdors','Rachis dorsal','rx','Osseux','',3],['r_rdl','Rachis dorso-lombaire','rx','Osseux','rachis dorsolombaire, rachis dorsolomabire',5],['r_rlomb','Rachis lombaire','rx','Osseux','',23],['r_squel','Squelette','rx','Osseux','',1],
 ['r_talon','Talon (calcanéum)','rx','Osseux','talon calcaneum, calcaneum',1],
 ['r_thorax','Thorax','rx','Respiratoire','radiographie pulmonaire, RP, poumons, rx poumons',329],['r_cavum','Cavum','rx','Respiratoire','',16],['r_sinus','Sinus','rx','Respiratoire','',1],
 ['r_asp','ASP (abdomen sans préparation)','rx','Digestif','ASP, abdomen sans preparation',32],
 ['s_hsg','Hystérosalpingographie (HSG)','spe','','HSG',44],['s_lb','Lavement baryté','spe','','lavement baryte, LB',6],['s_ucr','Urétrocystographie rétrograde (UCR)','spe','','UCR',5],
 ['s_togd','Transit œso-gastro-duodénal (TOGD)','spe','','TOGD, TOGD',2],['s_uiv','Urographie intraveineuse (UIV)','spe','','UIV',0],
 ['m_mammo','Mammographie','mam','','mammo',0],
 ['e_ap','Abdomino-pelvienne','echo','','abdomino pelvienne, abdo pelvienne',196],['e_abd','Abdominale','echo','','',5],['e_pelv','Pelvienne','echo','','',16],['e_ren','Rénale','echo','','renale',3],
 ['e_au','Arbre urinaire','echo','','',10],['e_rvp','RVP (reins, vessie, prostate)','echo','','RVP',30],['e_cerv','Cervicale','echo','','',45],['e_mam','Mammaire','echo','','',35],
 ['e_bourses','Bourses','echo','','scrotale',29],['e_masse','Masse','echo','','',21],['e_pm','Parties molles','echo','','',9],['e_etf','Transfontanellaire (ETF)','echo','','ETF',3],
 ['e_obst','Obstétricale (trimestre non précisé)','echo','','obstetricale',9],['e_t1','Obstétricale — 1er trimestre','echo','','premier trim, premier trimestre',0],
 ['e_t2','Obstétricale — 2e trimestre','echo','','deuxieme trim, deuxieme trimestre',1],['e_t3','Obstétricale — 3e trimestre','echo','','troisieme trim, troisieme trimestre',1],
 ['d_tsa','Doppler des troncs supra-aortiques (TSA)','dop','','TSA',8],['d_av','Doppler artério-veineux','dop','','doppler arterio veineux',8],['d_mi','Doppler des membres inférieurs','dop','','doppler des membres inf',8],
 ['d_ven','Doppler veineux','dop','','dopller veineux, doppler veineux',8],['d_art','Doppler artériel','dop','','doppler arteriel, doppler arterielle',6],['d_ren','Doppler rénal','dop','','doppler renale, doppler renal',1],
 ['d_fav','Doppler de fistule artério-veineuse (FAV)','dop','','FAV',0]
];
const defaultImgCat=()=>IMG_DEF.map(([id,lib,fam,sys,syn,w])=>({id,lib,fam,sys,syn,w,prix:TARIF_DEF[fam]??0,actif:true}));
const IMG_AGES=()=>({nom:'Imagerie (tranches du registre)',groups:[{l:'0–5 ans',min:0,max:6*Y-1},{l:'6–15 ans',min:6*Y,max:16*Y-1},{l:'16–25 ans',min:16*Y,max:26*Y-1},{l:'26–40 ans',min:26*Y,max:41*Y-1},{l:'41–50 ans',min:41*Y,max:51*Y-1},{l:'51–60 ans',min:51*Y,max:61*Y-1},{l:'Plus de 60 ans',min:61*Y,max:null}]});
const hasImgCat=s=>!!s&&s.type==='imag'&&(s.imag==='radio'||s.imag==='echo');
const imgCat=()=>(S&&S.imgCat)||defaultImgCat();
const catOfSvc=svcImag=>imgCat().filter(x=>IMG_FAM[x.fam]&&IMG_FAM[x.fam].svc===svcImag);
const SXK=['F','M','X'];
const emptyImg=()=>({ex:{},org:{EXT:0,INT:0,X:0},age:{},anr:{F:0,M:0,X:0}});
const cnt3=o=>o?(+o.F||0)+(+o.M||0)+(+o.X||0):0;
function imgTotals(img,svcImag){const t={ex:0,dem:0,demAge:0,fam:{}};if(!img)return t;
  for(const[id,v]of Object.entries(img.ex||{})){const it=imgCat().find(x=>x.id===id);if(svcImag&&it&&IMG_FAM[it.fam].svc!==svcImag)continue;const n=cnt3(v);t.ex+=n;if(it)t.fam[it.fam]=(t.fam[it.fam]||0)+n}
  t.dem=(+img.org?.EXT||0)+(+img.org?.INT||0)+(+img.org?.X||0);
  t.demAge=Object.values(img.age||{}).reduce((a,v)=>a+cnt3(v),0)+cnt3(img.anr);return t}
function addImg(dst,src){if(!src)return dst;
  for(const[id,v]of Object.entries(src.ex||{})){const d=dst.ex[id]=dst.ex[id]||{F:0,M:0,X:0};SXK.forEach(k=>d[k]+=+v[k]||0)}
  ['EXT','INT','X'].forEach(k=>dst.org[k]+=+src.org?.[k]||0);
  for(const[i,v]of Object.entries(src.age||{})){const d=dst.age[i]=dst.age[i]||{F:0,M:0,X:0};SXK.forEach(k=>d[k]+=+v[k]||0)}
  SXK.forEach(k=>dst.anr[k]+=+src.anr?.[k]||0);
  if(src.combo){dst.combo=dst.combo||{};for(const[c,v]of Object.entries(src.combo)){const d=dst.combo[c]=dst.combo[c]||{F:0,M:0,X:0};SXK.forEach(k=>d[k]+=+v[k]||0)}}
  if(src.mt){dst.mt=dst.mt||{};dst.mtn=dst.mtn||{};for(const[k,v]of Object.entries(src.mt))dst.mt[k]=(dst.mt[k]||0)+(+v||0);for(const[k,v]of Object.entries(src.mtn||{}))dst.mtn[k]=(dst.mtn[k]||0)+(+v||0)}
  if(src.vide){dst.vide=dst.vide||{F:0,M:0,X:0};SXK.forEach(k=>dst.vide[k]+=+src.vide[k]||0)}
  return dst}

/* --- Lecture du registre (classeur Excel ligne par ligne). Aucun nom ni téléphone n'est conservé : seuls des effectifs sont calculés. --- */
const MOIS_RX=[['JANVIER',1],['JANV',1],['JAN',1],['FEVRIER',2],['FEVR',2],['FEV',2],['MARS',3],['MAR',3],['AVRIL',4],['AVR',4],['MAI',5],['JUIN',6],['JUILLET',7],['JUIL',7],['AOUT',8],['SEPTEMBRE',9],['SEPT',9],['SEP',9],['OCTOBRE',10],['OCT',10],['NOVEMBRE',11],['NOV',11],['DECEMBRE',12],['DEC',12]];
function parseMois(v,stamp){
  const s=String(v??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const sy=stamp instanceof Date&&!isNaN(stamp)?stamp.getFullYear():null;
  for(const[k,m]of MOIS_RX){if(s.startsWith(k)){const rest=s.slice(k.length);if(rest===''&&sy)return sy+'-'+String(m).padStart(2,'0');
      if(/^\d{2}$/.test(rest))return(2000+ +rest)+'-'+String(m).padStart(2,'0');if(/^\d{4}$/.test(rest))return rest+'-'+String(m).padStart(2,'0');break}}
  return null}
function imgMatcher(){const map=new Map();
  imgCat().forEach(it=>{const keys=[it.lib,it.lib.replace(/\(.*?\)/g,''),...String(it.syn||'').split(',')];
    keys.forEach(k=>{const n=norm(k);if(n){const key=it.fam+'|'+n;if(!map.has(key))map.set(key,it.id);if(it.fam==='spe'||it.fam==='mam'){if(!map.has('*|'+n))map.set('*|'+n,it.id)}}})});
  return(fam,label)=>{const n=norm(label);return map.get(fam+'|'+n)||map.get(fam+'|'+norm(label.replace(/\(.*?\)/g,'')))||null}}
const SYS_RX=/\s*_\s*(Osseux|Respiratoire|Digestif)\s*/gi;
function splitCell(v,rx){if(v===null||v===undefined)return[];let s=String(v);
  if(rx)s=s.replace(SYS_RX,(m,g)=>' _'+g+'\n');
  return s.split(/[\n\r]+/).map(x=>x.replace(/^[^A-Za-zÀ-ÿ0-9]+/,'').trim()).filter(x=>x&&x!=='_')}
function ageGroupOf(v,groups){
  if(v===null||v===undefined||String(v).trim()==='')return null;const s=String(v).toUpperCase();
  if(/\+/.test(s)||/PLUS/.test(s))return groups.length-1;
  let n=null;const m=s.match(/^\s*(\d+)\s*-\s*(\d+)/);if(m)n=+m[1];else if(/^\s*\d+(\.\d+)?\s*$/.test(s))n=Math.floor(+s);
  if(n===null||n>120)return null;const d=n*Y;const i=groups.findIndex(g=>d>=g.min&&(g.max===null||d<=g.max));return i<0?null:i}
function parseRegister(rows){
  /* rows : tableau d'objets {colonne:valeur} ; retourne des effectifs par mois et par service */
  const match=imgMatcher(),groups=(S&&S.ages&&S.ages.img?S.ages.img:IMG_AGES()).groups;
  const out={months:{},unknown:{},numeric:0,noMonth:0,lines:0,sexBad:0,orgBad:0};
  const col=(r,name)=>{if(name in r)return r[name];const k=Object.keys(r).find(x=>norm(x)===norm(name));return k?r[k]:undefined};
  rows.forEach(r=>{
    const stamp=col(r,'Horodatage de modification');const ym=parseMois(col(r,'MOIS'),stamp instanceof Date?stamp:null);
    if(!ym){out.noMonth++;return}out.lines++;
    const M=out.months[ym]=out.months[ym]||{radio:emptyImg(),echo:emptyImg(),all:emptyImg(),lines:0,sexBad:0,orgBad:0,numeric:0,unknown:{}};M.lines++;
    const unk=(fam,t)=>{if(/^[\d\s+]+$/.test(t)){out.numeric++;M.numeric++;return}const k=IMG_FAM[fam].l+' : '+t.slice(0,40);out.unknown[k]=(out.unknown[k]||0)+1;M.unknown[k]=(M.unknown[k]||0)+1};
    const sxv=String(col(r,'SEXE')??'').trim().toUpperCase();const sx=sxv==='F'||sxv==='M'?sxv:'X';if(sx==='X'&&sxv){out.sexBad++;M.sexBad++}
    const ov=String(col(r,'ORIGINE')??'').trim().toUpperCase();const og=ov==='EXTERNE'?'EXT':ov==='INTERNE'?'INT':'X';if(og==='X'&&ov){out.orgBad++;M.orgBad++}
    const ag=ageGroupOf(col(r,'AGE'),groups);
    const found={radio:[],echo:[]},rxSeq=[];
    const take=(fam,cell,rx)=>splitCell(cell,rx).forEach(t=>{let lab=t,f=fam;if(rx){const m=t.match(/^(.*?)\s*_(Osseux|Respiratoire|Digestif)$/i);if(m)lab=m[1]}
      const id=match(f,lab)||(rx?match('*',lab):null);if(!id){unk(fam,t);return}const it=imgCat().find(x=>x.id===id);found[IMG_FAM[it.fam].svc].push(id);if(rx)rxSeq.push(id)});
    take('rx',col(r,'demanderx'),true);
    const pr=col(r,'Prestations');take('echo',pr!==null&&pr!==undefined&&String(pr).trim()!==''?pr:col(r,'Demande'),false);
    take('dop',col(r,'DEMANDE DOPPLER'),false);take('spe',col(r,'DEMANDE EXAMENS SPECIAUX'),false);take('mam',col(r,'DEMANDE MAMMO'),false);
    const dem=img=>{img.org[og]++;if(ag===null)img.anr[sx]++;else{const a=img.age[ag]=img.age[ag]||{F:0,M:0,X:0};a[sx]++}};
    ['radio','echo'].forEach(sv=>{if(!found[sv].length)return;const img=M[sv];dem(img);found[sv].forEach(id=>{const e=img.ex[id]=img.ex[id]||{F:0,M:0,X:0};e[sx]++})});
    dem(M.all);
    /* combinaisons de régions telles que présentées par le tableau croisé du classeur */
    const R=M.radio;R.combo=R.combo||{};R.vide=R.vide||{F:0,M:0,X:0};
    if(rxSeq.length){const k=rxSeq.join('+');const c=R.combo[k]=R.combo[k]||{F:0,M:0,X:0};c[sx]++}else R.vide[sx]++;
  });
  return out}
/* --- Données fictives d'imagerie (pondérations arrondies, aucune donnée réelle) --- */
const IMG_FSHARE={s_hsg:1,e_pelv:1,e_obst:1,e_t1:1,e_t2:1,e_t3:1,e_mam:.97,m_mammo:.99,e_rvp:0,e_bourses:0,s_ucr:.1};
function genImg(svcImag,R,factor){
  const img=emptyImg(),cat=catOfSvc(svcImag);let tot=0;
  cat.forEach(it=>{const w=it.w||0;const n=w?Math.max(0,Math.round(w*factor*(0.85+R()*0.3))):0;const fs=IMG_FSHARE[it.id]??(0.4+R()*0.12);const F=Math.round(n*fs);img.ex[it.id]={F,M:n-F,X:0};tot+=n});
  const dem=Math.round(tot/(svcImag==='radio'?1.2+R()*0.04:1.01));
  const INT=Math.round(dem*(0.03+R()*0.04));img.org={EXT:dem-INT,INT,X:0};
  const W=[1249,1624,2561,2664,1489,985,2064],groups=(S&&S.ages&&S.ages.img?S.ages.img:IMG_AGES()).groups;let left=dem;const sw=W.slice(0,groups.length).reduce((a,b)=>a+b,0)||1;
  groups.forEach((g,i)=>{const n=i===groups.length-1?left:Math.min(left,Math.round(dem*(W[i]||sw/groups.length)/sw*(0.9+R()*0.2)));left-=n;const F=Math.round(n*(svcImag==='echo'?0.55+R()*0.1:0.38+R()*0.1));img.age[i]={F,M:n-F,X:0}});
  return img}
/* --- Tableaux du rapport (structure commune : écran, CSV, Excel, PDF) --- */
function imgGroups(svcImag){const cat=catOfSvc(svcImag),out=[];
  Object.entries(IMG_FAM).filter(([f,o])=>o.svc===svcImag).forEach(([f,o])=>{const items=cat.filter(x=>x.fam===f);if(!items.length)return;
    const syss=[...new Set(items.map(x=>x.sys||''))];
    if(syss.some(Boolean)){const order=[...IMG_SYS.filter(y=>syss.includes(y)),...syss.filter(y=>y&&!IMG_SYS.includes(y)),...(syss.includes('')?['']:[])];
      order.forEach(sy=>out.push({key:f+'_'+(norm(sy).replace(/ /g,'_')||'autres'),fam:f,sys:sy,label:o.l+' — '+(sy||'sans système'),short:sy||'Sans système',items:items.filter(x=>(x.sys||'')===sy),multi:order.length>1}))}
    else out.push({key:f,fam:f,sys:'',label:o.l,short:o.l,items,multi:false})});
  return out}
const SXH=['F','M','(vide)','Total général'];
const row4=(l,o,k='r')=>({l,v:[+o.F||0,+o.M||0,+o.X||0,cnt3(o)],k});
const sum3=list=>list.reduce((a,o)=>({F:a.F+(+o.F||0),M:a.M+(+o.M||0),X:a.X+(+o.X||0)}),{F:0,M:0,X:0});
function famTable(img,fams,title,id,keepZero){
  const rows=[],tot=[];const groups=imgGroups(IMG_FAM[fams[0]]?.svc).filter(g=>fams.includes(g.fam));
  groups.forEach(g=>{const items=g.items.filter(it=>it.actif!==false||cnt3(img.ex[it.id]));const vals=items.map(it=>img.ex[it.id]||{F:0,M:0,X:0});
    const show=items.map((it,i)=>[it,vals[i]]).filter(([it,v])=>keepZero||cnt3(v));
    if(g.multi){rows.push({l:g.short,v:['','','',''],k:'g'});show.forEach(([it,v])=>rows.push(row4(it.lib,v)));rows.push(row4('Sous-total '+g.short,sum3(vals),'s'))}
    else show.forEach(([it,v])=>rows.push(row4(it.lib,v)));tot.push(...vals)});
  rows.push(row4('Total général',sum3(tot),'t'));
  return{id,title,measure:'Nombre d’examens',head:SXH,rows}}
function comboTable(img){const cat=imgCat();const lab=k=>k.split('+').map(id=>cat.find(x=>x.id===id)?.lib||id).join(' + ');
  const rows=Object.entries(img.combo||{}).map(([k,v])=>row4(lab(k),v)).sort((a,b)=>a.l.localeCompare(b.l,'fr'));
  const vide=img.vide||{F:0,M:0,X:0};rows.push(row4('(vide)',vide));
  rows.push(row4('Total général',sum3([...Object.values(img.combo||{}),vide]),'t'));
  return{id:'combo',blankZero:true,title:'Radiographies par région(s) demandée(s) et par sexe — présentation du classeur',measure:'Nombre de Clé primaire (demandes)',head:SXH,rows,note:'Une ligne = une combinaison de régions demandées ensemble sur une même demande, comme dans le tableau croisé du classeur. « (vide) » : demandes de la période sans radiographie (échographie, doppler, examens spéciaux).'}}
function orgTable(list){return{id:'org',title:'Demandes (patients-passages) par origine',measure:'Nombre de demandes',head:['Externe','Interne','(vide)','Total général'],
  rows:list.map(([l,img])=>({l,v:[+img.org.EXT||0,+img.org.INT||0,+img.org.X||0,(+img.org.EXT||0)+(+img.org.INT||0)+(+img.org.X||0)],k:'r'}))}}
function ageTable(l,img,id){const groups=(S&&S.ages&&S.ages.img?S.ages.img:IMG_AGES()).groups;const vals=groups.map((g,i)=>img.age[i]||{F:0,M:0,X:0});
  const rows=groups.map((g,i)=>row4(g.l,vals[i]));rows.push(row4('Âge non renseigné',img.anr||{F:0,M:0,X:0}));rows.push(row4('Total général',sum3([...vals,img.anr||{}]),'t'));
  return{id,title:'Demandes par tranche d’âge et par sexe — '+l,measure:'Nombre de demandes',head:SXH,rows}}

/* --- Saisie par patient : un passage = une demande, avec un ou plusieurs actes --- */
function passToImg(pass){const img=emptyImg();img.mt={};img.mtn={};
  (pass||[]).forEach(p=>{const sx=p.sx==='F'||p.sx==='M'?p.sx:'X',og=p.org==='EXT'||p.org==='INT'?p.org:'X';img.org[og]++;
    if(p.age===null||p.age===undefined||p.age==='')img.anr[sx]++;else{const a=img.age[p.age]=img.age[p.age]||{F:0,M:0,X:0};a[sx]++}
    (p.actes||[]).forEach(a=>{if(!a.id)return;const e=img.ex[a.id]=img.ex[a.id]||{F:0,M:0,X:0};e[sx]++;if(a.prix!==null&&a.prix!==''&&!isNaN(+a.prix)){img.mt[a.id]=(img.mt[a.id]||0)+(+a.prix);img.mtn[a.id]=(img.mtn[a.id]||0)+1}})});
  return img}
function genPass(svcImag,R,factor,ym){const base=genImg(svcImag,R,factor),units=[];const cat=catOfSvc(svcImag);
  Object.entries(base.ex).forEach(([id,v])=>{const it=cat.find(x=>x.id===id);['F','M'].forEach(sx=>{for(let i=0;i<v[sx];i++)units.push({id,sx,prix:it?.prix||0})})});
  for(let i=units.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[units[i],units[j]]=[units[j],units[i]]}
  const groups=(S&&S.ages&&S.ages.img?S.ages.img:IMG_AGES()).groups,W=[1249,1624,2561,2664,1489,985,2064],sw=W.slice(0,groups.length).reduce((a,b)=>a+b,0);
  const pickAge=()=>{let x=R()*sw;for(let i=0;i<groups.length;i++){x-=W[i]||0;if(x<=0)return i}return groups.length-1};
  const D=daysIn(ym),pass=[];let n=0;
  for(let i=0;i<units.length;i++){const u=units[i],actes=[{id:u.id,prix:u.prix}];
    while(i+1<units.length&&units[i+1].sx===u.sx&&R()<(svcImag==='radio'?0.17:0.01)){i++;actes.push({id:units[i].id,prix:units[i].prix})}
    if(R()<0.04)actes.forEach(a=>a.prix=0);

function findPatients(prenom,nom,tel){
  /* Chaque champ suffit à lui seul : un patient est proposé dès qu'un critère correspond ; ceux qui correspondent à plusieurs critères passent en tête */
  const tk=v=>norm(v).split(' ').filter(w=>w.length>=2),tp=tk(prenom),tn=tk(nom),t=String(tel||'').replace(/\D/g,'');
  const code=(norm(prenom+' '+nom+' '+tel).match(/img \d{3,}/)||[null])[0];
  if(!tp.length&&!tn.length&&t.length<4&&!code)return{total:0,list:[],searched:false};
  const map=new Map();S.recs.forEach(r=>{const words=norm(r.prenom+' '+r.nom).split(' '),has=ws=>ws.length&&ws.every(w=>words.some(x=>x.startsWith(w)));
    let sc=0;if(has(tp))sc++;if(has(tn))sc++;if(t.length>=4&&String(r.tel||'').replace(/\D/g,'').includes(t))sc+=2;if(code&&norm(r.cle).includes(code))sc+=3;if(!sc)return;

function buildModel(){const o=UI.rap,months=[...o.months].sort(),{st,nr}=modelStats(months),rows=[],used=new Set();
  const line=(l,list)=>{const z={EXT:0,INT:0,X:0,cl:0};list.forEach(id=>{const s=st[id];if(s){z.EXT+=s.EXT;z.INT+=s.INT;z.X+=s.X;z.cl+=s.cl}});return{l,k:'r',ext:z.EXT,int:z.INT,tot:z.EXT+z.INT+z.X,cl:z.cl}};
  const extras=(fam,pred)=>S.imgCat.filter(x=>x.fam===fam&&!used.has(x.id)&&pred(x)&&st[x.id]).sort((a,b)=>a.lib.localeCompare(b.lib,'fr'));
  const rxName=x=>'Rx '+x.lib;
  MODEL.forEach(b=>{
    if(b.sec&&!b.fam){rows.push({l:b.sec,k:'sec'});return}
    if(b.sys){rows.push({l:b.sys,k:'sys'});b.ids.forEach(([id,l])=>{used.add(id);rows.push(line(l,[id]))});return}
    rows.push({l:b.sec,k:'sec'});
    if(b.agg){const items=S.imgCat.filter(x=>x.fam===b.fam);items.forEach(x=>used.add(x.id));
      if(o.detEcho){items.filter(x=>st[x.id]||x.actif!==false&&PIN.includes(x.id)).sort((a,c)=>(PIN.indexOf(a.id)+1||99)-(PIN.indexOf(c.id)+1||99)||a.lib.localeCompare(c.lib,'fr')).forEach(x=>rows.push(line(x.lib,[x.id])));rows.push({...line('Total '+b.agg.toLowerCase(),items.map(x=>x.id)),k:'st'})}
      else rows.push(line(b.agg,items.map(x=>x.id)));return}
    b.ids.forEach(([id,l])=>{used.add(id);rows.push(line(l,[id]))});extras(b.fam,()=>true).forEach(x=>{used.add(x.id);rows.push(line(x.lib,[x.id]))})});
  /* actes du catalogue absents du modèle : placés dans leur système, après les lignes du modèle */
  const rxExtra=extras('rx',()=>true);if(rxExtra.length){
    MODEL.filter(b=>b.sys).forEach(b=>{const add=rxExtra.filter(x=>(x.sys||'')===b.key);if(!add.length)return;const idx=rows.findIndex(r=>r.k==='sys'&&r.l===b.sys);let end=idx+1;while(end<rows.length&&rows[end].k==='r')end++;
      rows.splice(end,0,...add.map(x=>{used.add(x.id);return line(rxName(x),[x.id])}))});
    const rest=rxExtra.filter(x=>!used.has(x.id));if(rest.length){const groups={};rest.forEach(x=>(groups[x.sys||'']=groups[x.sys||'']||[]).push(x));
      const at=rows.findIndex(r=>r.k==='sec'&&r.l==='MAMMOGRAPHIE');const ins=[];Object.entries(groups).forEach(([sy,list])=>{ins.push({l:sy?'SYSTÈME '+sy.toUpperCase():'AUTRES RADIOGRAPHIES',k:'sys'});list.forEach(x=>{used.add(x.id);ins.push(line(rxName(x),[x.id]))})});rows.splice(at,0,...ins)}}
  Object.entries(IMG_FAM).filter(([f])=>!['rx','spe','mam','echo','dop','scan'].includes(f)).forEach(([f,x])=>{const items=S.imgCat.filter(i=>i.fam===f&&st[i.id]);if(!items.length)return;rows.push({l:x.l.toUpperCase(),k:'sec'});items.forEach(i=>rows.push(line(i.lib,[i.id])))});
  const notes=[];if(nr.n)notes.push(`${fmt(nr.n)} passage(s) sans origine renseignée : leurs examens sont comptés dans le TOTAL seulement.`);
  const ex=rows.filter(r=>r.k==='r'&&!MODEL.some(b=>(b.ids||[]).some(([,l])=>l===r.l))&&!['Echographie','Echodoppler'].includes(r.l)&&!o.detEcho);
  if(ex.length)notes.push('Actes du catalogue absents du modèle, ajoutés dans leur section : '+ex.map(r=>r.l).join(', ')+'.');
  const anyCl=rows.some(r=>r.cl);if(!anyCl)notes.push('Nombre de clichés : non renseigné pour la période (à saisir dans la Demande de chaque acte).');

   <p class="muted small">Les fiches sont conservées dans ce navigateur uniquement : elles ne sont ni partagées entre postes ni sauvegardées ailleurs. Exportez le registre régulièrement.</p></section>`}

/* --- Rendu et événements --- */
const VIEWS={saisie:viewSaisie,liste:viewListe,rapport:viewRapport,params:viewParams};
function render(){imgSyncRef();document.querySelectorAll('[data-nav-btn]').forEach(b=>{const on=b.dataset.v===UI.view;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false')});
  $('#view').innerHTML=VIEWS[UI.view]();$('#demoTag').hidden=!S.demo;$('#store').textContent=persisted?'':'Stockage indisponible : les saisies seront perdues à la fermeture.'}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,v=t.dataset.v;
  if(a==='closeBg'){if(e.target===t)closeModal();return}
  if(a==='close'){closeModal();return}
  if(a==='nav'){UI.view=v;render();window.scrollTo(0,0);return}
  if(a==='tab'){readForm();UI.f.tab=v;render();return}
  if(a==='addEx'){readForm();const id=UI.f.sel[v]||$('#exSel').value;if(!id){toast('Choisissez un examen dans la liste.');return}UI.f.ex[v].ids.push(id);if(v==='scan'){const e=UI.f.ex.scan;e.inj=e.inj||[];e.inj[e.ids.length-1]=catById(id)?.inj||document.querySelector('input[name=injSel]:checked')?.value||'C'}{const e=UI.f.ex[v],i=e.ids.length-1;e.px=e.px||[];e.pp=e.pp||[];e.px[i]=tarifOf(id,v==='scan'?e.inj[i]:'')||'';e.pp[i]=''}if(!UI.f.ex[v].date&&!UI.f.ex[v].rdv)UI.f.ex[v].date=today();UI.f.sel[v]='';UI.confirmDup=null;render();$('#exSel')?.focus();return}
  if(a==='rmEx'){readForm();const[f,i]=v.split('|');UI.f.ex[f].ids.splice(+i,1);if(UI.f.ex[f].cl)UI.f.ex[f].cl.splice(+i,1);if(UI.f.ex[f].inj)UI.f.ex[f].inj.splice(+i,1);['px','pp'].forEach(k=>{if(UI.f.ex[f][k])UI.f.ex[f][k].splice(+i,1)});render();return}
  if(a==='saveRec'){saveRec();return}
  if(a==='newRec'){UI.f=blankForm();UI.confirmDup=null;render();return}
  if(a==='delRec'){modal(`<h2>Supprimer la fiche ${esc(UI.f.edit)} ?</h2><p>Le passage et ses examens seront retirés du registre et du rapport.</p><div class="btns"><button type="button" class="btn danger" data-act="delOk">Supprimer</button><button type="button" class="btn ghost" data-act="close">Annuler</button></div>`);return}
  if(a==='delOk'){S.recs=S.recs.filter(r=>r.cle!==UI.f.edit);save();toast(`Fiche ${UI.f.edit} supprimée`);UI.f=blankForm();closeModal();render();return}
  if(a==='open'){openRow(v);return}
  if(a==='pg'){const[k,d]=v.split('|');UI[k].page+=+d;refreshBlock(k);return}
  if(a==='fReset'){const o=UI[v];UI[v]=defFilt(v,o.mode);UI[v].date=o.date;refreshBlock(v);return}
  if(a==='rdvDo'){rdvAct(v,e=>{e.rdvSt='realise';e.date=today()},'Rendez-vous réalisé');return}
  if(a==='rdvMove'){const d=$('#rp_'+v).value;if(!d||d<today()){toast('Choisissez une nouvelle date, aujourd’hui ou plus tard.');$('#rp_'+v).focus();return}
    const old=S.recs.find(x=>x.cle===UI.rdvCle).ex[v].rdv;rdvAct(v,e=>{e.rdv=d;e.rdvSt='prevu';e.motif=''},`Rendez-vous reporté du ${frDate(old)} au ${frDate(d)}`);return}
  if(a==='rdvCancel'){const m=$('#ra_'+v).value.trim();if(!m){toast('Indiquez le motif d’annulation.');$('#ra_'+v).focus();return}rdvAct(v,e=>{e.rdvSt='annule';e.motif=m},'Rendez-vous annulé : '+m);return}
  if(a==='rdvDel'){if(UI.delRdv!==v){UI.delRdv=v;rdvModal(UI.rdvCle);return}const old=S.recs.find(x=>x.cle===UI.rdvCle).ex[v].rdv;rdvAct(v,e=>{e.rdv='';e.rdvSt='';e.motif=''},`Rendez-vous du ${frDate(old)} supprimé`);return}
  if(a==='openFiche'){closeModal();openRec(UI.rdvCle);return}
  if(a==='delFiche'){if(!UI.delFiche){UI.delFiche=true;rdvModal(UI.rdvCle);return}const c=UI.rdvCle;S.recs=S.recs.filter(r=>r.cle!==c);save();UI.delFiche=false;if(UI.f.edit===c)UI.f=blankForm();closeModal();render();toast(`Fiche ${c} supprimée`);return}
  if(a==='spUse'){const p=UI.spList[+v],r=p.recs[0];Object.assign(UI.f,{prenom:r.prenom,nom:r.nom,tel:r.tel||'',sexe:r.sexe,age:String(r.age??''),origine:r.origine||'EXTERNE',pay:r.pay||'',ex:emptyEx(),sel:{},mois:today().slice(0,7),
      tab:FAMS.find(([k])=>r.ex[k].ids.length)?.[0]||'echo',from:{cle:r.cle,n:p.recs.length,last:r.cree}});UI.ferr={};UI.confirmDup=null;render();
    const card=$('.exams');if(card){card.classList.add('pulse');card.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>card.classList.remove('pulse'),1600)}setTimeout(()=>$('#exSel')?.focus({preventScroll:true}),350);
    toast(`Nouveau passage pour ${r.prenom} ${r.nom} : choisissez les examens puis enregistrez.`);return}
  if(a==='unFrom'){UI.f=blankForm();render();$('#fPrenom')?.focus();return}
  if(a==='spRdv'){const p=UI.spList[+v],r=p.recs.find(x=>pendingRdv(x));if(r){UI.delRdv=null;UI.delFiche=false;rdvModal(r.cle)}return}
  if(a==='spAll'){const p=UI.spList[+v];UI.liste=defFilt('liste','all');UI.liste.q=p.prenom+' '+p.nom;UI.view='liste';render();window.scrollTo(0,0);return}
  if(a==='rView'){if(v==='scan'){UI.rap.view='detail';UI.rap.svc='scan'}else{UI.rap.view=v;if(v==='detail'&&UI.rap.svc==='scan')UI.rap.svc='all'}render();return}
  if(a==='xlsModel'){xlsModel(UI.modelLast);return}
  if(a==='xlsFin'){xlsFinance(UI.finLast);return}
  if(a==='finReset'){UI.fin={q:'',pay:'',fam:'',org:'',sexe:'',age:'',d1:'',d2:'',page:0,src:''};finRefresh();return}
  if(a==='finPg'){UI.fin.page+=+v;finRefresh();document.getElementById('finBox')?.querySelector('.plist')?.scrollIntoView({block:'start'});return}
  if(a==='finOpen'){openRow(v);return}
  if(a==='mpOk'){const t2=addPayType($('#mpL').value);if(!t2)return;closeModal();readForm();UI.f.pay=t2.id;delete UI.ferr.pay;render();return}
  if(a==='addPay'){if(addPayType($('#npL').value))render();return}
  if(a==='xlsScanModel'){xlsScanModel(UI.scanModelLast);return}
  if(a==='xlsRep'){xlsReport(UI.repLast);return}
  if(a==='xlsReg'){xlsRegister(UI.repLast.months);return}
  if(a==='xlsAll'){xlsRegister(null);return}
  if(a==='ptab'){UI.ptab=v;render();return}
  if(a==='addSys'){const l=$('#nSysNew').value.trim();if(!l){toast('Saisissez le nom du système.');return}const cur=S.imgSys||[...IMG_SYS];if(cur.some(y=>norm(y)===norm(l))){toast('Ce système existe déjà.');return}S.imgSys=[...cur,l];imgSyncRef();save();render();toast('Système ajouté');return}
  if(a==='simCancel'){$('#nLib').value='';$('#simBox').innerHTML='';$('#nLib').focus();return}
  if(a==='addItem'||a==='addItemForce'){const lib=$('#nLib').value.trim(),syn=$('#nSyn').value.trim(),sys=$('#nSys').value;if(!lib){toast('Saisissez le libellé.');return}
    const c=imgClash([lib,...syn.split(',')],v,null);if(c){$('#simBox').innerHTML=`<div class="note warn" style="margin-top:8px"><b>Cet acte existe déjà :</b> « ${esc(c.lib)} » (${esc(IMG_FAM[c.fam].l)}). Ajout refusé.</div>`;toast(`Doublon : correspond à « ${c.lib} ».`);return}
    if(a==='addItem'&&similarActs(lib,v).length){$('#simBox').innerHTML=simHtml(lib,v,true);toast('Un acte similaire existe déjà : confirmez ou annulez.');return}
    S.imgCat.push({id:'c_'+Date.now().toString(36),lib,fam:v,sys,syn,w:0,prix:0,actif:true,...(v==='scan'?{inj:$('#nInj')?.value||''}:{})});save();render();toast('Examen ajouté à la liste');return}
  if(a==='reset'){modal(`<h2>Réinitialiser la démonstration ?</h2><p>Toutes les fiches de ce navigateur seront remplacées par les données fictives d’origine. Exportez d’abord le registre si vous avez saisi des données réelles.</p><div class="btns"><button type="button" class="btn danger" data-act="resetOk">Réinitialiser</button><button type="button" class="btn ghost" data-act="close">Annuler</button></div>`);return}
  if(a==='resetOk'){S=buildDemo();save();UI.f=blankForm();closeModal();render();toast('Démonstration réinitialisée');return}
  if(a==='doImport'){doImport();return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.matches('tr[data-act="open"]'))openRow(e.target.dataset.v)});
document.addEventListener('change',async e=>{const t=e.target,a=t.dataset.act,v=t.dataset.v;
  if(a==='sel'){UI.f.sel[v]=t.value;if(v==='scan')render();return}
  if(a==='injSel'){UI.f.injSel=t.value;render();return}
  if(a==='inj'){const[f,i]=v.split('|');const e=UI.f.ex[f];e.inj=e.inj||[];e.inj[+i]=t.value;e.px=e.px||[];e.pp=e.pp||[];e.px[+i]=tarifOf(e.ids[+i],t.value)||e.px[+i];render();return}
  if(a==='px'||a==='pp'){const[f,i]=v.split('|');const e=UI.f.ex[f];e.px=e.px||[];e.pp=e.pp||[];const val=t.value===''?'':Math.max(0,Math.round(+t.value));t.value=val;
    if(a==='pp'&&val!==''&&e.px[+i]!==''&&e.px[+i]!=null&&val>+e.px[+i]){toast('Le montant payé par le patient dépasse le prix de l’acte : vérifiez.');t.classList.add('bad')}else t.classList.remove('bad');
    e[a][+i]=val;const mb=$('#moneyBox');if(mb)mb.innerHTML=moneyInner(UI.f);return}
  if(a==='pay'){if(t.value==='__new'){t.value=UI.f.pay||'';newPayModal();return}readForm();UI.f.pay=t.value;delete UI.ferr.pay;render();return}
  if(a==='exDate'){UI.f.ex[v].date=t.value;return}
  if(a==='exRdv'){const e=UI.f.ex[v];if(e.rdv!==t.value){e.rdv=t.value;e.rdvSt=t.value?'prevu':'';e.motif='';if(UI.f.edit){e.hist=e.hist||[];e.hist.push({d:nowLocal(),a:t.value?'Date de RDV modifiée dans la fiche : '+frDate(t.value):'RDV retiré dans la fiche'})}}render();return}
  if(t.dataset.f){UI.f[t.dataset.f]=t.value;UI.confirmDup=null;return}
  if(t.dataset.filt){const[k,fld]=t.dataset.filt.split('|');if(fld==='q')return;UI[k][fld]=fld==='date'?(t.value||today()):t.value;UI[k].page=0;refreshBlock(k,t.id);return}
  if(a==='rSvc'){UI.rap.svc=t.value;render();return}
  if(a==='rMode'){UI.rap.mode=t.value;render();return}
  if(a==='rZero'){UI.rap.zero=t.checked;render();return}
  if(a==='rCols'){UI.rap.cols=t.value;render();return}
  if(a==='rOrg'){UI.rap.org=t.checked;render();return}
  if(a==='rDet'){UI.rap.detEcho=t.checked;render();return}
  if(a==='cl'){const[f,i]=v.split('|');const e=UI.f.ex[f];e.cl=e.cl||[];e.cl[+i]=t.value===''?'':Math.max(0,Math.round(+t.value));return}
  if(t.dataset.fin){if(t.dataset.fin==='q')return;UI.fin[t.dataset.fin]=t.value;UI.fin.page=0;finRefresh(t.id);return}
  if(a==='rMonth'){const m=v;UI.rap.months=t.checked?[...new Set([...UI.rap.months,m])]:UI.rap.months.filter(x=>x!==m);render();return}
  if(t.dataset.pay){const[id,k]=t.dataset.pay.split('|'),p=payById(id);let val=t.value.trim();if(k==='l'){val=val.toUpperCase();if(!val||S.payTypes.some(x=>x!==p&&norm(x.l)===norm(val))){toast(val?'Ce type existe déjà.':'Libellé obligatoire.');render();return}}p[k]=val;save();toast('Type de paiement mis à jour');return}
  if(t.dataset.item){const[id,k]=t.dataset.item.split('|'),x=catById(id);let val=t.type==='checkbox'?t.checked:t.value.trim();
    if(k==='lib'&&!val){toast('Libellé obligatoire.');render();return}
    if(k==='lib'||k==='syn'){const c=imgClash(k==='lib'?[val]:String(val).split(','),x.fam,x.id);if(c){toast(`Doublon : déjà utilisé par « ${c.lib} ».`);render();return}}
    if(k==='prix'||k==='prixP')val=val===''?0:Math.max(0,Math.round(+val));x[k]=val;save();if(k==='sys')render();toast('Liste mise à jour');return}
  if(t.id==='impFile'){const f=t.files[0];t.value='';if(!f)return;toast('Lecture du fichier…');
    try{const I=await readImport(f);const ms=Object.keys(I.months).sort();I.sel=ms.slice(-1);UI.imp=I;importModal()}catch(err){toast(err.message||'Lecture impossible.')}}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.fin==='q'){UI.fin.q=t.value;UI.fin.page=0;clearTimeout(UI.finT);UI.finT=setTimeout(()=>finRefresh('finQ'),180);return}
  if(t.id==='catQ'){UI.catQ=t.value;const bx=$('#catBox');if(bx)bx.innerHTML=catTableHtml(UI.ptab||'echo');return}
  if(t.id==='nLib'){const bx=$('#simBox');if(bx)bx.innerHTML=simHtml(t.value,UI.ptab||'echo',false);return}
  if(t.dataset.filt&&t.dataset.filt.endsWith('|q')){const k=t.dataset.filt.split('|')[0];UI[k].q=t.value;UI[k].page=0;refreshBlock(k,t.id);return}
  if(['prenom','nom','tel'].includes(t.dataset.f)){UI.f[t.dataset.f]=t.value;if(UI.f.from){delete UI.f.from;const bx=$('#exHead');if(bx)bx.remove()}if(UI.ferr[t.dataset.f]&&!nameErr(t.value)){delete UI.ferr[t.dataset.f];t.closest('.fld')?.classList.remove('invalid');t.parentNode.querySelector('.err')?.remove()}const b=$('#sugg');if(b)b.innerHTML=suggHtml()}});
render();

</script>
